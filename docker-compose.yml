services:
  passpal:
    build: .
    image: passpal:latest
    container_name: passpal
    restart: unless-stopped

    # 只绑本机，公网访问走 OpenResty 反代
    ports:
      - "127.0.0.1:3000:3000"

    # 运行期加固
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64

    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

    env_file:
      - .env

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
